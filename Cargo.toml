[workspace]
resolver = "2"
members = ["contracts/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SorobanPool/sorobanpool-contracts"

[workspace.dependencies]
soroban-sdk = "=28.0.0"
sp_common = { path = "crates/sp_common" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# Keep test binaries small: the SDK test host is large and debug info multiplies it.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
