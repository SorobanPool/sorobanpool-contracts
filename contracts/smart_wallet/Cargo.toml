[package]
name = "smart_wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Passkey-controlled account for SorobanPool users (WebAuthn / secp256r1)."

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
sp_common = { workspace = true }
# Audited WebAuthn assertion verification from OpenZeppelin Stellar Contracts (ADR 0006).
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
p256 = { version = "=0.14.0", features = ["ecdsa"] }
base64 = "=0.22.1"
