name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Cache stellar-cli
        id: cache-stellar
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/stellar
          key: stellar-cli-28.1.0-linux-x86_64
      - name: install stellar-cli
        if: steps.cache-stellar.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar xz -C /usr/local/bin stellar
          stellar --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace   # includes the pricing-vectors staleness check
      - run: stellar contract build
      - name: wasm size report
        run: ls -l target/wasm32v1-none/release/*.wasm
      - name: export errors.json / events.json
        run: python3 scripts/export_artifacts.py
      - uses: actions/upload-artifact@v7
        with:
          name: contract-artifacts
          path: |
            artifacts/errors.json
            artifacts/events.json
            vectors/pricing-vectors.json
            target/wasm32v1-none/release/*.wasm

  bindings:
    name: Bindings freshness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Cache stellar-cli
        id: cache-stellar-bindings
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/stellar
          key: stellar-cli-28.1.0-linux-x86_64
      - name: install stellar-cli
        if: steps.cache-stellar-bindings.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar xz -C /usr/local/bin stellar
          stellar --version
      - name: build contracts wasm
        run: stellar contract build
      - name: check bindings freshness
        run: |
          scripts/bindings.sh
          if ! git diff --exit-code bindings/; then
            echo "::error::Bindings are out of date! Please run 'scripts/bindings.sh' and commit the changes in bindings/."
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: line coverage floor (brief 6.8 asks 90% on group_buy, disputes, supplier_bond)
        run: |
          cargo llvm-cov --workspace --summary-only --json --output-path cov.json
          python3 - <<'PY'
          import json,sys
          bad=[]
          for f in json.load(open("cov.json"))["data"][0]["files"]:
              n=f["filename"]
              if any(n.endswith(f"contracts/{c}/src/lib.rs") for c in ("group_buy","disputes","supplier_bond")):
                  pct=f["summary"]["lines"]["percent"]; print(n,round(pct,2))
                  if pct<90: bad.append(n)
          sys.exit(1 if bad else 0)
          PY
